name: ci
on:
  push: { branches: [main, staging] }
  pull_request:
  # The staging-follow job below runs this on `staging` after bringing main's changes over (a push
  # made with the workflow's own token starts no run by itself).
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The `staging` branch builds against the staging database (STAGING_SUPABASE_*), everything
      # else against production's.
      NEXT_PUBLIC_SUPABASE_URL: ${{ github.ref == 'refs/heads/staging' && vars.STAGING_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/staging' && vars.STAGING_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Cloudflare Turnstile on the sign-in (DEPLOY.md, "Sign-in protection"); empty = off.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      # Cloudflare Web Analytics site token (DEPLOY.md, "Monitoring"); empty = no beacon from the site.
      NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck
      - run: pnpm --filter web test
      # The two registration forms (forms/community, forms/petromin; npm packages of their own,
      # outside the pnpm workspace): the pages the website serves must be what their sources
      # build, and the forms are driven in a browser. Here, before the deploy, so a broken form
      # never reaches micromobility.sa.
      - name: Forms are built from their sources
        run: (cd forms/community && npm run build) && (cd forms/petromin && npm run build) && git diff --exit-code
      - name: Form specs
        run: |
          npm ci --prefix forms/community --no-audit --no-fund
          npm ci --prefix forms/petromin --no-audit --no-fund
          (cd forms/community && npx playwright install --with-deps chromium)
          (cd forms/community && npm run e2e)
          (cd forms/petromin && npm run e2e)
      # Staging: the forms' built pages name production's project; point them at staging's, after
      # the check above that they are what their sources build.
      - name: Point the forms at the staging database
        if: github.ref == 'refs/heads/staging'
        env:
          FROM_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          FROM_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TO_URL: ${{ vars.STAGING_SUPABASE_URL }}
          TO_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
        run: node scripts/point-forms.mjs
      - run: pnpm --filter web exec opennextjs-cloudflare build
      # The site's own pages in a browser, English and Arabic, desktop and phone, with an
      # accessibility check (e2e/site). Runs on the build above, open whatever the real site's
      # switch says (MM_TEST_SITE_OPEN); it only reads the database's public content.
      - name: Site pages in a browser
        run: |
          npm ci --prefix e2e/site --no-audit --no-fund
          (cd e2e/site && npx playwright install --with-deps chromium && npm run e2e)
      # The production deploy below needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
      # Without them wrangler-action runs with empty values and fails, turning a push red for
      # a step that was never going to work, so check once and skip instead.
      - id: secrets
        name: Check for Cloudflare credentials
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.present != 'true'
        name: Skip (no Cloudflare token — nothing deploys)
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; the build is verified, nothing is deployed."
      # NO AUTOMATIC PREVIEW. A push builds, lints and typechecks; it deploys nothing.
      #
      # There used to be a "Deploy preview" step here that ran `wrangler deploy` on every push
      # to main and created the Worker `micromobility-web-preview` on a workers.dev address.
      # It was removed on 2026-09-20 at the owner's request, and that Worker was deleted: a
      # push should not put anything into the Cloudflare account unasked. To preview, deploy
      # by hand from apps/web:
      #
      #   CLOUDFLARE_ACCOUNT_ID=<account> npx wrangler deploy
      #
      # To bring the automatic preview back, restore this step from git history
      # (commit 9b3e25d has the last version) and re-add it below the secrets check.
      # The real site on micromobility.sa: only once the repository variable
      # MM_PRODUCTION is set to "on" (Settings > Secrets and variables > Actions > Variables).
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && vars.MM_PRODUCTION == 'on' && steps.secrets.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env production
      # The live site answers after the deploy: the site, its health check (which reads the
      # database), the two forms and a bike's tag page (at its new address; /b/1 answers a redirect
      # to it). A red run here means production needs a look.
      - name: The live site answers
        if: github.ref == 'refs/heads/main' && vars.MM_PRODUCTION == 'on' && steps.secrets.outputs.present == 'true'
        run: |
          sleep 20
          fail=0
          for u in / /api/health /petromin /community/registration /bikes/1 /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --retry-all-errors "https://micromobility.sa$u")
            echo "$u $code"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail
      # Staging: the `staging` branch deploys staging.micromobility.sa (wrangler.jsonc env
      # "staging"), never production. It sits behind Cloudflare Access, so an outside request is
      # answered with Access's sign-in (302/403); anything 5xx means the deploy needs a look.
      - name: Deploy staging
        if: github.ref == 'refs/heads/staging' && steps.secrets.outputs.present == 'true' && vars.STAGING_SUPABASE_URL != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env staging
      - name: Staging answers
        if: github.ref == 'refs/heads/staging' && steps.secrets.outputs.present == 'true' && vars.STAGING_SUPABASE_URL != ''
        run: |
          sleep 20
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --retry-all-errors https://staging.micromobility.sa/)
          echo "staging / $code"
          [ "$code" -lt 500 ]

  # Live → staging, code: after main is green (and deployed), main's changes are merged into
  # `staging`, staging's CI is started (it builds, tests and deploys staging.micromobility.sa), and
  # the content copy runs (staging-sync.yml). Work already on staging and not yet on main is kept:
  # this is a merge, never a reset. A conflict stops here, red, for a person to merge by hand.
  # Staging → live is never automatic: a change tried on staging reaches main when it is merged there.
  staging-follow:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Merge main into staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin staging >/dev/null; then
            git checkout -B staging origin/staging
            git merge --no-edit origin/main || { echo "::error::main and staging conflict; merge them by hand"; exit 1; }
          else
            git checkout -B staging origin/main
          fi
          git push origin staging
      - name: Deploy staging and copy the content
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh workflow run ci.yml --ref staging
          gh workflow run staging-sync.yml --ref main
