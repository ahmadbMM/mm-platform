name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web exec opennextjs-cloudflare build
      # The production deploy below needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
      # Without them wrangler-action runs with empty values and fails, turning a push red for
      # a step that was never going to work, so check once and skip instead.
      - id: secrets
        name: Check for Cloudflare credentials
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.present != 'true'
        name: Skip (no Cloudflare token — nothing deploys)
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; the build is verified, nothing is deployed."
      # NO AUTOMATIC PREVIEW. A push builds, lints and typechecks; it deploys nothing.
      #
      # There used to be a "Deploy preview" step here that ran `wrangler deploy` on every push
      # to main and created the Worker `micromobility-web-preview` on a workers.dev address.
      # It was removed on 2026-09-20 at the owner's request, and that Worker was deleted: a
      # push should not put anything into the Cloudflare account unasked. To preview, deploy
      # by hand from apps/web:
      #
      #   CLOUDFLARE_ACCOUNT_ID=<account> npx wrangler deploy
      #
      # To bring the automatic preview back, restore this step from git history
      # (commit 9b3e25d has the last version) and re-add it below the secrets check.
      # The real site on micromobility.sa: only once the repository variable
      # MM_PRODUCTION is set to "on" (Settings > Secrets and variables > Actions > Variables).
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && vars.MM_PRODUCTION == 'on' && steps.secrets.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env production
